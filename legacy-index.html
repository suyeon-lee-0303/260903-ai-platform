<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>디지털이음 AI교육원 — AI 상담 신청</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16273D;
    --navy-soft:#22364d;
    --teal:#2F9E7C;
    --teal-dark:#227A61;
    --coral:#E8845B;
    --bg:#F7F5F1;
    --card:#FFFFFF;
    --ink:#1F2937;
    --ink-soft:#4B5563;
    --line:#E6E1D8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    font-size:18px;
    line-height:1.7;
  }
  h1,h2,h3{ font-family:'Gowun Batang', serif; margin:0; }
  .wrap{ max-width:760px; margin:0 auto; padding:0 24px; }

  /* ---------- HERO ---------- */
  .hero{
    background: radial-gradient(circle at 85% -10%, #2b4560 0%, var(--navy) 55%);
    color:#fff;
    padding:64px 0 56px;
  }
  .eyebrow{
    display:inline-block;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.02em;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:22px;
  }
  .hero h1{
    font-size:40px;
    font-weight:700;
    line-height:1.4;
    margin-bottom:16px;
  }
  .hero p{
    font-size:19px;
    color:#D8DEE6;
    max-width:520px;
    margin:0;
  }
  .mobile-break{ display:none; }
  @media (max-width:480px){
    .mobile-break{ display:block; }
  }
  .hero .badge-row{
    margin-top:28px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .badge{
    font-size:13px;
    font-weight:500;
    color:#cfe8dd;
    background:rgba(47,158,124,0.18);
    border:1px solid rgba(47,158,124,0.4);
    padding:5px 12px;
    border-radius:8px;
  }

  /* ---------- DEMO SECTION ---------- */
  .demo{ padding:48px 0 20px; }
  .demo h2{
    font-size:26px;
    color:var(--navy);
    margin-bottom:8px;
  }
  .demo .lead{
    color:var(--ink-soft);
    font-size:16px;
    margin-bottom:24px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
  }
  .chip{
    background:var(--card);
    border:1.5px solid var(--line);
    color:var(--navy);
    font-size:15px;
    font-weight:500;
    padding:10px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .chip:hover{ border-color:var(--teal); color:var(--teal-dark); background:#F0FAF6; }
  .chip:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }

  .input-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    box-shadow:0 4px 18px rgba(22,39,61,0.06);
  }
  textarea{
    width:100%;
    min-height:84px;
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-family:inherit;
    font-size:17px;
    resize:vertical;
    color:var(--ink);
  }
  textarea:focus{ outline:none; border-color:var(--teal); }
  textarea:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }

  .ask-btn{
    margin-top:12px;
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:12px;
    font-family:inherit;
    font-size:18px;
    font-weight:700;
    padding:16px;
    cursor:pointer;
    transition: background .15s ease;
  }
  .ask-btn:hover{ background:var(--teal-dark); }
  .ask-btn:disabled{ background:#9CB8AE; cursor:not-allowed; }
  .ask-btn:focus-visible{ outline:3px solid var(--navy); outline-offset:2px; }

  .apply-btn{ background:var(--coral); }
  .apply-btn:hover{ background:#CD6B45; }
  .apply-btn:disabled{ background:#EFC1AA; cursor:not-allowed; }

  #startApplyBtn{ margin-top:20px; }

  .apply-collapse{
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition: max-height .45s ease, opacity .35s ease;
  }
  .apply-collapse.open{
    max-height:1400px;
    opacity:1;
    margin-top:20px;
  }

  .answer-zone{ margin-top:22px; min-height:20px; }
  .bubble{
    background:#F0FAF6;
    border:1px solid #CBE9DD;
    border-radius:14px;
    padding:18px 20px;
    color:var(--ink);
    font-size:17px;
    white-space:pre-wrap;
  }
  .bubble .who{
    display:block;
    font-weight:700;
    color:var(--teal-dark);
    font-size:14px;
    margin-bottom:8px;
  }
  .error-bubble{
    background:#FDEEE8;
    border:1px solid #F1C4AF;
    color:#9C4423;
    border-radius:14px;
    padding:16px 20px;
    font-size:15px;
  }
  .loading{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--ink-soft);
    font-size:15px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--teal);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .dot:nth-child(2){ animation-delay:.15s; }
  .dot:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,80%,100%{ transform:scale(0.6); opacity:.5;} 40%{ transform:scale(1); opacity:1;} }

  /* ---------- JOURNEY STRIP (signature element) ---------- */
  .journey{ padding:40px 0 8px; }
  .journey h3{
    font-size:15px;
    color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    margin-bottom:14px;
  }
  .steps{
    display:flex;
    gap:6px;
  }
  .step{
    flex:1;
    text-align:center;
    padding:10px 4px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
    color:#9AA5B1;
    background:#EFECE5;
  }
  .step.active{
    background:var(--navy);
    color:#fff;
  }
  .journey .cap{
    margin-top:10px;
    font-size:14px;
    color:var(--ink-soft);
  }

  /* ---------- APPLY FORM ---------- */
  .apply{ padding:44px 0 8px; }
  .apply h2{
    font-size:26px;
    color:var(--navy);
    margin-bottom:8px;
  }
  .apply .lead{
    color:var(--ink-soft);
    font-size:16px;
    margin-bottom:24px;
  }
  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-weight:700;
    color:var(--navy);
    font-size:15px;
    margin-bottom:8px;
  }
  .field input[type="text"],
  .field input[type="tel"]{
    width:100%;
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-family:inherit;
    font-size:17px;
    color:var(--ink);
  }
  .field input[type="text"]:focus,
  .field input[type="tel"]:focus{ outline:none; border-color:var(--teal); }
  .field input[type="text"]:focus-visible,
  .field input[type="tel"]:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }

  .field select{
    width:100%;
    border:2px solid var(--line);
    border-radius:12px;
    padding:14px;
    font-family:inherit;
    font-size:17px;
    color:var(--ink);
    background:#fff;
  }
  .field select:focus{ outline:none; border-color:var(--teal); }
  .field select:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }

  .check-grid{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .check-item{
    display:flex;
    align-items:center;
    gap:8px;
    background:#F7F5F1;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
  }
  .check-item input{ width:18px; height:18px; accent-color:var(--teal); cursor:pointer; }
  .check-item:has(input:checked){ border-color:var(--teal); background:#F0FAF6; color:var(--teal-dark); font-weight:700; }

  .consent-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:6px;
    margin-bottom:18px;
  }
  .consent-row input{ width:18px; height:18px; margin-top:2px; accent-color:var(--teal); cursor:pointer; flex-shrink:0; }

  .form-msg{ margin-top:14px; }
  .form-msg .error-bubble{ margin-top:0; }

  .done-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:40px 24px;
    text-align:center;
    box-shadow:0 4px 18px rgba(22,39,61,0.06);
  }
  .done-card .check{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--teal);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:28px;
    margin:0 auto 18px;
  }
  .done-card h3{
    font-size:22px;
    color:var(--navy);
    margin-bottom:10px;
  }
  .done-card p{
    color:var(--ink-soft);
    font-size:16px;
    margin:0;
  }

  /* ---------- FOOTER ---------- */
  footer{
    padding:40px 0 60px;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.8;
  }
  footer .line{
    border-top:1px solid var(--line);
    padding-top:20px;
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="wrap">
      <span class="eyebrow">디지털이음 AI교육원</span>
      <h1>AI가 어려워도<span class="mobile-break"></span> 괜찮아요.<br>질문 하나로<span class="mobile-break"></span> 시작해요.</h1>
      <p>AI 상담 서비스입니다.<span class="mobile-break"></span> 궁금한 걸 편하게 물어보세요<br>— AI가 눈높이에 맞춰 바로 답해드려요.</p>
    </div>
  </div>

  <div class="wrap">
    <div class="demo">
      <h2>지금 바로 물어보세요</h2>
      <p class="lead">아래 예시를 눌러보거나, 직접 궁금한 것을 적어보세요.</p>

      <div class="chip-row">
        <button class="chip" onclick="fillQuestion('요즘 사람들이 쓰는 AI가 뭐예요?')">요즘 사람들이 쓰는 AI가 뭐예요?</button>
        <button class="chip" onclick="fillQuestion('프롬프트가 무슨 뜻이에요?')">프롬프트가 무슨 뜻이에요?</button>
        <button class="chip" onclick="fillQuestion('카톡으로 사진을 크게 보내고 싶어요')">카톡 사진 크게 보내기</button>
        <button class="chip" onclick="fillQuestion('생성형 AI로 제가 뭘 할 수 있어요?')">생성형 AI로 뭘 할 수 있나요?</button>
      </div>

      <div class="input-card">
        <textarea id="q" placeholder="여기에 궁금한 점을 적어주세요. 예: 챗지피티가 뭔가요?"></textarea>
        <button class="ask-btn" id="askBtn" onclick="ask()">AI 도우미에게 물어보기</button>

        <div class="answer-zone" id="answerZone"></div>
      </div>
    </div>

    <div class="apply" id="applySection">
      <h2>무료 체험 신청하기</h2>
      <p class="lead">비슷한 내용을 직접 배워보실 수 있어요. 이름과 연락처만 남겨주시면 안내해드릴게요.</p>

      <button type="button" class="ask-btn apply-btn" id="startApplyBtn">무료체험 신청하기</button>

      <div class="apply-collapse" id="applyCollapse">
      <div class="input-card">
        <form id="applyForm">
          <div class="field">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="예: 홍길동" required>
          </div>
          <div class="field">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" name="phone" placeholder="010-0000-0000" required>
          </div>
          <div class="field">
            <label for="email">이메일 <span style="font-weight:400;color:var(--ink-soft);">(선택)</span></label>
            <input type="email" id="email" name="email" placeholder="예: example@email.com">
          </div>
          <div class="field">
            <label for="ageGroup">연령대</label>
            <select id="ageGroup" name="ageGroup" required>
              <option value="" disabled selected>선택해주세요</option>
              <option value="30대">30대</option>
              <option value="40대">40대</option>
              <option value="50대">50대</option>
              <option value="60대">60대</option>
              <option value="70대 이상">70대 이상</option>
            </select>
          </div>
          <div class="field">
            <label for="interest">배우고 싶은 것</label>
            <select id="interest" name="interest" required>
              <option value="" disabled selected>선택해주세요</option>
              <option value="스마트폰 활용 (사진, 카톡, 앱 사용법)">스마트폰 활용 (사진, 카톡, 앱 사용법)</option>
              <option value="챗GPT 사용법">챗GPT 사용법</option>
              <option value="클로드(Claude) 사용법">클로드(Claude) 사용법</option>
              <option value="AI로 그림 그리기">AI로 그림 그리기</option>
              <option value="AI로 영상 만들기">AI로 영상 만들기</option>
              <option value="AI 기초 (AI가 뭔지부터 알고 싶어요)">AI 기초 (AI가 뭔지부터 알고 싶어요)</option>
              <option value="유튜브·SNS 활용법">유튜브·SNS 활용법</option>
              <option value="AI 활용 자격증(강사과정)">AI 활용 자격증(강사과정)</option>
              <option value="잘 모르겠어요, 상담받고 싶어요">잘 모르겠어요, 상담받고 싶어요</option>
              <option value="기타">기타</option>
            </select>
            <input type="text" id="interestOther" placeholder="배우고 싶은 것을 적어주세요" style="display:none;margin-top:10px;">
          </div>
          <div class="field">
            <label for="timeSlot">희망 시간대</label>
            <select id="timeSlot" name="timeSlot" required>
              <option value="" disabled selected>선택해주세요</option>
              <option value="오전">오전</option>
              <option value="저녁">저녁</option>
              <option value="주말">주말</option>
              <option value="직접 입력">직접 입력</option>
            </select>
            <input type="text" id="timeSlotOther" placeholder="예: 화요일 오후 2시" style="display:none;margin-top:10px;">
          </div>
          <div class="field">
            <label for="source">유입경로</label>
            <select id="source" name="source" required>
              <option value="" disabled selected>선택해주세요</option>
              <option value="블로그">블로그</option>
              <option value="지인추천">지인추천</option>
              <option value="현수막">현수막</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <label class="consent-row">
            <input type="checkbox" id="consent" required>
            <span>(필수) 개인정보 수집·이용에 동의합니다. 남겨주신 정보는 상담 및 안내 목적으로만 사용됩니다.</span>
          </label>
          <button type="submit" class="ask-btn apply-btn" id="submitBtn">신청하기</button>
          <div class="form-msg" id="formMsg"></div>
        </form>
      </div>
      </div>
    </div>

    <div class="apply" id="doneSection" style="display:none;">
      <div class="done-card">
        <div class="check">✓</div>
        <h3 id="doneTitle">신청이 완료되었어요!</h3>
        <p id="doneBody">담당자가 확인 후 카카오톡으로 안내해드릴게요.<br>소중한 신청 감사합니다.</p>
      </div>
    </div>

    <footer>
      <div class="line">
        © 2026 디지털이음 AI교육원. All rights reserved.
      </div>
    </footer>
  </div>

<script>
// ▼▼▼ 이 부분만 나중에 바꿔주세요 ▼▼▼
// 구글 앱스 스크립트를 "웹 앱으로 배포"하면 나오는 주소를
// 아래 큰따옴표 " " 사이에 붙여넣으세요.
const GAS_URL = "https://script.google.com/macros/s/AKfycby6ro5CpWYPlEy68wZfPh8uLfvY5c-h_aV_eMCFHB4-2F7KYQ29GTYUemoBn6G6IMIF/exec";
// ▲▲▲ 이 부분만 나중에 바꿔주세요 ▲▲▲

function fillQuestion(text){
  document.getElementById('q').value = text;
  document.getElementById('q').focus();
}

async function ask(){
  const q = document.getElementById('q').value.trim();
  const zone = document.getElementById('answerZone');
  const btn = document.getElementById('askBtn');

  if(!q){
    zone.innerHTML = '<div class="error-bubble">질문을 먼저 적어주세요.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = '답변을 준비하고 있어요...';
  zone.innerHTML = '<div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div> AI 도우미가 생각하고 있어요</div>';

  try{
    if(GAS_URL.includes('여기에_배포된_웹앱_URL')){
      throw new Error('GAS_URL not set');
    }

    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: 'ask', question: q })
    });

    const data = await response.json();

    if(data.result !== 'success' || !data.answer){
      throw new Error(data.message || 'empty response');
    }

    zone.innerHTML = '<div class="bubble"><span class="who">AI 도우미</span>' + data.answer.replace(/</g,'&lt;') + '</div>';
  }catch(err){
    zone.innerHTML = '<div class="error-bubble">일시적으로 답변을 가져오지 못했어요. 잠시 후 다시 시도해주세요.</div>';
    console.error("Claude API error:", err);
  }finally{
    btn.disabled = false;
    btn.textContent = 'AI 도우미에게 물어보기';
  }
}

function bindOtherInput(selectId, inputId, triggerValue){
  const select = document.getElementById(selectId);
  const input = document.getElementById(inputId);
  select.addEventListener('change', function(){
    if(select.value === triggerValue){
      input.style.display = 'block';
    }else{
      input.style.display = 'none';
      input.value = '';
    }
  });
}
bindOtherInput('interest', 'interestOther', '기타');
bindOtherInput('timeSlot', 'timeSlotOther', '직접 입력');

document.getElementById('startApplyBtn').addEventListener('click', function(){
  this.style.display = 'none';
  const collapse = document.getElementById('applyCollapse');
  collapse.classList.add('open');
  setTimeout(function(){
    collapse.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 250);
});

document.getElementById('applyForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const submitBtn = document.getElementById('submitBtn');
  const msgZone = document.getElementById('formMsg');

  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const ageGroup = document.getElementById('ageGroup').value;
  const source = document.getElementById('source').value;
  const consent = document.getElementById('consent').checked;

  let interest = document.getElementById('interest').value;
  let timeSlot = document.getElementById('timeSlot').value;

  if(!name || !phone){
    msgZone.innerHTML = '<div class="error-bubble">이름과 연락처를 입력해주세요.</div>';
    return;
  }
  if(!ageGroup){
    msgZone.innerHTML = '<div class="error-bubble">연령대를 선택해주세요.</div>';
    return;
  }
  if(!interest){
    msgZone.innerHTML = '<div class="error-bubble">배우고 싶은 것을 선택해주세요.</div>';
    return;
  }
  if(interest === '기타'){
    const interestOther = document.getElementById('interestOther').value.trim();
    if(!interestOther){
      msgZone.innerHTML = '<div class="error-bubble">배우고 싶은 것을 직접 적어주세요.</div>';
      return;
    }
    interest = interestOther;
  }
  if(!timeSlot){
    msgZone.innerHTML = '<div class="error-bubble">희망 시간대를 선택해주세요.</div>';
    return;
  }
  if(timeSlot === '직접 입력'){
    const timeSlotOther = document.getElementById('timeSlotOther').value.trim();
    if(!timeSlotOther){
      msgZone.innerHTML = '<div class="error-bubble">희망 시간대를 직접 적어주세요.</div>';
      return;
    }
    timeSlot = timeSlotOther;
  }
  if(!source){
    msgZone.innerHTML = '<div class="error-bubble">유입경로를 선택해주세요.</div>';
    return;
  }
  if(!consent){
    msgZone.innerHTML = '<div class="error-bubble">개인정보 수집·이용 동의가 필요해요.</div>';
    return;
  }
  if(GAS_URL.includes('여기에_배포된_웹앱_URL')){
    msgZone.innerHTML = '<div class="error-bubble">아직 구글시트 연동 주소가 설정되지 않았어요. (관리자 확인 필요)</div>';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = '신청 중이에요...';
  msgZone.innerHTML = '';

  try{
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name, phone, email, ageGroup, interests: interest, timeSlot, source })
    });

    const data = await response.json();

    if(data.result !== 'success'){
      throw new Error(data.message || 'unknown error');
    }

    document.getElementById('doneTitle').textContent = name + '님, \'' + interest + '\' 신청이 완료되었습니다!';
    document.getElementById('doneBody').innerHTML = '1~2일 안에 전화 또는 문자로<br>무료 체험 일정을 안내드릴게요.';

    document.getElementById('applySection').style.display = 'none';
    document.getElementById('doneSection').style.display = 'block';
    document.getElementById('doneSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }catch(err){
    msgZone.innerHTML = '<div class="error-bubble">신청 접수 중 문제가 생겼어요. 잠시 후 다시 시도해주세요.</div>';
    console.error('Google Sheet 연동 오류:', err);
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = '신청하기';
  }
});
</script>

</body>
</html>
